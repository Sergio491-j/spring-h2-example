spring.application.name=spring-data-examples-h2

###Tenemos una expresión donde se usan variables por defecto.
###Si no configuras nada en las variables de entorno se usa lo que esta en verde
server.port=${PORT:8080}
###Es como un RequestMapping pero en todo el backend
api.path=/api
###La versión de la API
api.version=v1

###Lo mismo que en el puerto
spring.datasource.url=${DB_URL:jdbc:h2:file:./datos/funkos;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=
###El nombre de el driver (viene con la dependencia)
spring.datasource.driver-class-name=org.h2.Driver

###El esquema y los datos que creamos nosotros

### Para que la base de datos ejecute siempre los ficheros de abajo
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

###Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=never

###Esto es para el Logger y no usar println
logging.level.org.sostapis=DEBUG



